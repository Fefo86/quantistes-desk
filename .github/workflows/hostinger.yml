name: Quantistes su Hostinger
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quantistes-hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compila e verifica il desk
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: node scripts/check-export.mjs
      - run: node scripts/check-chart-paints.mjs
      - run: node scripts/check-local-market.mjs
      - run: node scripts/check-local-export.mjs out
      - name: Prepara il pacchetto protetto
        run: python3 scripts/package-hostinger.py --output "$RUNNER_TEMP/pacchetti"
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: desk-php-${{ github.sha }}
          path: ${{ runner.temp }}/pacchetti/Quantistes-Hostinger.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Aggiorna il ramo hostinger
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: desk-php-${{ github.sha }}
          path: ${{ runner.temp }}/pacchetti
      - name: Pubblica la build verificata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          bash .github/publish-hostinger.sh "$RUNNER_TEMP/pacchetti/Quantistes-Hostinger.zip"
